  <script>
    function min(a,b){
      return a <= b ? a : b;
    }

    alert('El mínimo de (1,1) es ' + String(min(1,1)));
    alert('El mínimo de (2,1) es ' + String(min(2,1)));
    alert('El mínimo de (2,2) es ' + String(min(2,2)));
    alert('El mínimo de (1,2) es ' + String(min(1,2)));
  </script>
